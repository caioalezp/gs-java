services:
  - type: web
    name: citizentech-cidade-em-alerta
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: DB_URL
        value: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DDL_AUTO
        value: update
